<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soon...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }

    .popup {
      width: 300px;
      padding: 20px;
      background-color: #fff;
      border: 2px solid #ccc;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .popup-header {
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }

    .popup-content {
      margin: 20px 0;
      font-size: 14px;
      color: #666;
    }

    .popup-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      padding: 5px 15px;
      border: 1px solid #ccc;
      background-color: #e0e0e0;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="popup">
    <div class="popup-header">Alert</div>
    <div class="popup-content">Soon...</div>
    <div class="popup-buttons">
      <button onclick="closePopup()">OK</button>
    </div>
  </div>

  <script>
    function closePopup() {
      document.querySelector('.popup').style.display = 'none';
    }
  </script>
</body>
</html>
